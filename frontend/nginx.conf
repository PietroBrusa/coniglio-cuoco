# Processed at container startup by the nginx image's envsubst step
# (only ${PORT} is substituted — see NGINX_ENVSUBST_FILTER in the Dockerfile),
# so the same image listens on port 80 locally and on Render's $PORT.
server {
    listen       ${PORT};
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # SPA fallback: every unknown path serves index.html so React Router works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
